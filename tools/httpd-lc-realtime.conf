# LiveChat WebSocket — include inside SSL VirtualHost (erp.3knotsdigital.com)
# Browser: wss://erp.3knotsdigital.com/lc-realtime  ->  Node ws://127.0.0.1:6001

<IfModule mod_proxy.c>
    <IfModule mod_proxy_wstunnel.c>
        ProxyPreserveHost On
        RequestHeader set X-Forwarded-Proto "https"

        RewriteEngine On
        RewriteCond %{HTTP:Upgrade} =websocket [NC]
        RewriteRule ^/lc-realtime/?(.*)$ ws://127.0.0.1:6001/$1 [P,L]
        RewriteCond %{HTTP:Upgrade} !=websocket [NC]
        RewriteRule ^/lc-realtime/?(.*)$ http://127.0.0.1:6001/$1 [P,L]

        ProxyPassReverse /lc-realtime/ http://127.0.0.1:6001/
    </IfModule>
</IfModule>
