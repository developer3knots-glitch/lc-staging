<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveChat Widget Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Work Sans', system-ui, sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #0f172a, #1e293b); color: #fff; text-align: center; padding: 2rem; }
        h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        p { opacity: 0.8; max-width: 520px; margin: 0 auto 1rem; }
        a { color: #6FD943; }
        code { background: rgba(255,255,255,0.1); padding: 0.2rem 0.5rem; border-radius: 6px; }
    </style>
</head>
<body>
    <div>
        <h1 id="demo-title">LiveChat Demo</h1>
        <p>Brand: <code id="demo-brand">default</code> — chat bubble bottom-right par click karein.</p>
        <p>Admin: <a href="admin/login.php">Login</a> → <a href="admin/chats.php">Live Chats</a></p>
        <p><small>Dusra brand test: <code>?brand=your-brand-key</code></small></p>
    </div>
    <script>
        (function(){
            var params = new URLSearchParams(location.search);
            var brand = params.get('brand') || 'default';
            document.getElementById('demo-brand').textContent = brand;
            document.getElementById('demo-title').textContent = 'LiveChat — ' + brand;
            var base = location.origin + location.pathname.replace(/\/demo\.html$/, '');
            var s = document.createElement('script');
            s.src = base + '/assets/js/lc-time.js?v=1';
            document.body.appendChild(s);
            s.onload = function () {
                var w = document.createElement('script');
                w.src = base + '/widget/embed.js?v=39';
                w.setAttribute('data-site', base);
                w.setAttribute('data-brand', brand);
                document.body.appendChild(w);
            };
        })();
    </script>
</body>
</html>
